<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Buddy</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family: system-ui, sans-serif; color:#e0e7ff;
         background: radial-gradient(ellipse at top, #0b1437 0%, #04060f 70%); }
  /* Moving stars are drawn on this canvas, behind everything */
  #sky { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }

  .screen { display:none; position:relative; z-index:1; min-height:100vh; padding:30px 20px;
            flex-direction:column; align-items:center; justify-content:center; text-align:center;
            animation: fade .6s ease; }
  .screen.active { display:flex; }
  @keyframes fade { from { opacity:0; transform:translateY(16px);} to { opacity:1; transform:none; } }

  h1 { font-size:clamp(1.6rem, 5vw, 2.6rem); font-weight:800; margin:0 0 30px; max-width:700px;
       text-shadow:0 0 18px rgba(147,197,253,.6); }
  h2 { font-size:clamp(1.3rem, 4vw, 1.9rem); margin:0 0 20px; text-shadow:0 0 14px rgba(147,197,253,.5); }

  /* Screen 1: four YES boxes that zoom on hover */
  .grid4 { display:grid; grid-template-columns:1fr 1fr; gap:16px; width:100%; max-width:380px; }
  .yes { background:rgba(30,58,138,.35); border:2px solid #60a5fa; border-radius:18px; padding:26px 10px;
         font-size:1.4rem; font-weight:700; cursor:pointer; color:#e0e7ff;
         transition: transform .25s ease, box-shadow .25s ease; }
  .yes:hover, .yes:active { transform:scale(1.15); box-shadow:0 0 24px rgba(96,165,250,.8); }

  /* Inputs and buttons */
  .field { width:100%; max-width:420px; }
  input { width:100%; padding:15px; border-radius:14px; border:2px solid #3b82f6; background:rgba(15,23,42,.8);
          color:#e0e7ff; font-size:1.05rem; outline:none; }
  input:focus { box-shadow:0 0 18px rgba(96,165,250,.7); }
  button.main { margin-top:18px; background:#3b82f6; color:#fff; border:none; border-radius:14px;
                padding:14px 40px; font-size:1.05rem; font-weight:700; cursor:pointer;
                box-shadow:0 0 16px rgba(59,130,246,.6); }
  button.main:disabled { opacity:.5; cursor:not-allowed; }
  button.link { background:none; border:none; color:#93c5fd; text-decoration:underline; cursor:pointer;
                margin-top:16px; font-size:.95rem; }
  .error { color:#fca5a5; margin-top:12px; min-height:1.2em; }

  /* Screen 3: subject suggestions (alphabetical) */
  .sugg { margin-top:8px; max-height:220px; overflow-y:auto; background:rgba(15,23,42,.92);
          border:1px solid #1e3a8a; border-radius:14px; text-align:left; }
  .sugg div { padding:11px 14px; cursor:pointer; }
  .sugg div:hover { background:#1e3a8a; }

  /* Screen 4: style options */
  .styles { display:flex; flex-direction:column; gap:14px; width:100%; max-width:380px; }
  .style { background:rgba(30,58,138,.35); border:2px solid #60a5fa; border-radius:18px; padding:20px;
           font-size:1.2rem; cursor:pointer; transition: transform .25s, box-shadow .25s; }
  .style span { font-size:1.6rem; margin-right:8px; }
  .style:hover, .style:active { transform:scale(1.07); box-shadow:0 0 22px rgba(96,165,250,.8); }

  /* Loading */
  .spin { font-size:3.5rem; animation: spin 2s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Result */
  .result { width:100%; max-width:640px; text-align:left; }
  .result .rtitle { text-align:center; font-size:1.7rem; font-weight:800; margin-bottom:6px;
                    text-shadow:0 0 16px rgba(147,197,253,.6); }
  .tag { text-align:center; color:#93c5fd; margin-bottom:14px; }
  .card { background:rgba(15,23,42,.85); border:1px solid #1e3a8a; border-radius:16px; padding:16px;
          margin-top:12px; animation: fade .5s ease; }
  .card h3 { margin:0 0 6px; }
  .card p { margin:0; line-height:1.65; }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<!-- Screen 1: Intro with 4 "Yes" boxes -->
<div class="screen active" id="s1">
  <h1>Getting nervous of those complex topics??</h1>
  <div class="grid4">
    <div class="yes" onclick="go('s2')">Yes</div>
    <div class="yes" onclick="go('s2')">Yes</div>
    <div class="yes" onclick="go('s2')">Yes</div>
    <div class="yes" onclick="go('s2')">Yes</div>
  </div>
</div>

<!-- Screen 2: Topic -->
<div class="screen" id="s2">
  <h2>Enter your topic</h2>
  <div class="field"><input id="topic" maxlength="100" placeholder="e.g. recursion, inflation"></div>
  <div class="error" id="err2"></div>
  <button class="main" onclick="topicDone()">Done</button>
</div>

<!-- Screen 3: Subject with suggestions -->
<div class="screen" id="s3">
  <h2>In which subject do you want it explained?</h2>
  <div class="field">
    <input id="subject" maxlength="60" placeholder="Start typing a subject..." autocomplete="off">
    <div class="sugg" id="sugg" style="display:none"></div>
  </div>
  <div class="error" id="err3"></div>
  <button class="main" onclick="subjectDone()">Done</button>
  <button class="link" onclick="go('s2')">← Back</button>
</div>

<!-- Screen 4: Style -->
<div class="screen" id="s4">
  <h2>How do you want it explained?</h2>
  <div class="styles">
    <div class="style" onclick="pickStyle('simple')"><span>📝</span>Simple words</div>
    <div class="style" onclick="pickStyle('exam')"><span>📚</span>Exam notes</div>
    <div class="style" onclick="pickStyle('example')"><span>🌍</span>Real life example</div>
  </div>
  <div class="error" id="err4"></div>
  <button class="link" onclick="go('s3')">← Back</button>
</div>

<!-- Loading -->
<div class="screen" id="s5">
  <div class="spin">🪐</div>
  <h2 style="margin-top:20px">Exploring the universe of knowledge...</h2>
</div>

<!-- Result -->
<div class="screen" id="s6">
  <div class="result" id="result"></div>
  <button class="main" onclick="restart()">Learn another topic 🚀</button>
</div>

<script>
  // ---------- Moving stars (slow motion, each with a glowing tail) ----------
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const count = Math.round((canvas.width * canvas.height) / 14000); // fewer stars on small screens
    stars = [];
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.08 + Math.random() * 0.3;           // slow
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: 0.6 + Math.random() * 1.4
      });
    }
  }
  window.addEventListener('resize', resize);
  resize();

  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      s.x += s.vx; s.y += s.vy;
      // wrap around the edges
      if (s.x < -50) s.x = canvas.width + 50;
      if (s.x > canvas.width + 50) s.x = -50;
      if (s.y < -50) s.y = canvas.height + 50;
      if (s.y > canvas.height + 50) s.y = -50;

      // tail: a line that fades out behind the star
      const tx = s.x - s.vx * 45, ty = s.y - s.vy * 45;
      const g = ctx.createLinearGradient(tx, ty, s.x, s.y);
      g.addColorStop(0, 'rgba(147,197,253,0)');
      g.addColorStop(1, 'rgba(191,219,254,0.85)');
      ctx.strokeStyle = g;
      ctx.lineWidth = s.r;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(s.x, s.y); ctx.stroke();

      // the glowing star head
      ctx.shadowBlur = 10; ctx.shadowColor = '#93c5fd';
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    requestAnimationFrame(drawStars);
  }
  drawStars();

  // ---------- Screens ----------
  let topic = '', subject = '';

  function go(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }

  function topicDone() {
    topic = document.getElementById('topic').value.trim();
    if (!topic) { document.getElementById('err2').textContent = 'Please enter a topic first.'; return; }
    document.getElementById('err2').textContent = '';
    go('s3');
    document.getElementById('subject').focus();
  }
  document.getElementById('topic').addEventListener('keydown', e => { if (e.key === 'Enter') topicDone(); });

  // ---------- Subject suggestions ----------
  const SUBJECTS = ['Accountancy','Anatomy','Artificial Intelligence','Astronomy','Biochemistry','Biology',
    'Biotechnology','Botany','Business Studies','Chemistry','Civil Engineering','Commerce',
    'Computer Networks','Computer Science','Data Structures and Algorithms','Database Management',
    'Digital Electronics','Economics','Electrical Engineering','Electronics','Engineering Mathematics',
    'English Literature','Environmental Science','Finance','Genetics','Geography','Geology','History',
    'Human Physiology','Law','Linguistics','Machine Learning','Management','Marketing','Mathematics',
    'Mechanical Engineering','Medicine','Microbiology','Operating Systems','Philosophy','Physics',
    'Political Science','Programming','Psychology','Sociology','Software Engineering','Statistics',
    'Thermodynamics','Zoology'].sort();

  const subjectInput = document.getElementById('subject');
  const sugg = document.getElementById('sugg');

  subjectInput.addEventListener('input', () => {
    const q = subjectInput.value.trim().toLowerCase();
    if (!q) { sugg.style.display = 'none'; return; }
    // match anywhere in the name, then keep alphabetical order
    const matches = SUBJECTS.filter(s => s.toLowerCase().includes(q)).sort();
    if (matches.length === 0) { sugg.style.display = 'none'; return; }
    sugg.innerHTML = matches.map(m => '<div>' + esc(m) + '</div>').join('');
    sugg.style.display = 'block';
    sugg.querySelectorAll('div').forEach(d => {
      d.onclick = () => { subjectInput.value = d.textContent; sugg.style.display = 'none'; };
    });
  });
  subjectInput.addEventListener('keydown', e => { if (e.key === 'Enter') subjectDone(); });

  function subjectDone() {
    subject = subjectInput.value.trim();
    if (!subject) { document.getElementById('err3').textContent = 'Please enter a subject.'; return; }
    document.getElementById('err3').textContent = '';
    sugg.style.display = 'none';
    go('s4');
  }

  // ---------- Ask the AI ----------
  async function pickStyle(style) {
    go('s5');
    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ concept: topic, subject, style })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong.');
      showResult(data);
    } catch (e) {
      go('s4');
      document.getElementById('err4').textContent = e.message;
    }
  }

  function showResult(d) {
    const cards = d.items.map(i =>
      '<div class="card"><h3>' + esc(i.emoji) + ' ' + esc(i.heading) + '</h3><p>' + esc(i.text) + '</p></div>'
    ).join('');
    document.getElementById('result').innerHTML =
      '<div class="rtitle">' + esc(d.title) + '</div>' +
      '<div class="tag">' + esc(subject) + '</div>' + cards;
    go('s6');
  }

  function restart() {
    document.getElementById('topic').value = '';
    subjectInput.value = '';
    document.getElementById('err4').textContent = '';
    go('s2');
  }

  // Makes text safe to show on a page
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }
</script>
</body>
</html>
